---
# ============================================================================
#  flags — dragon balls #3,#4,#5, user.txt, goku SSH, dragonballs collection dir
#  (Balls #1/#2 live in the ftp/mail roles; #6/#7 + root.txt in the privesc role.)
# ============================================================================

# ---- Ball #3: post-web-RCE, in the processed uploads (www-data) --------------
- name: Dragon ball 3 (web deserialization loot)
  ansible.builtin.copy:
    content: "{{ flag_ball_3 }}\n"
    dest: "{{ capsule_data }}/uploads/processed/dragon_ball_3.txt"
    owner: www-data
    group: www-data
    mode: "0644"

# ---- Ball #4: "captured" by Frieza's soldiers (friezacrypt / AES-256-CBC) -----
# Lore: they abused the same web RCE first and sealed ball #4. The plaintext
# flag never lands on disk — only the encrypted blob + a ransom note do. The
# player recovers the leaked key from the /recovery portal and decrypts it.
- name: Dragon ball 4 — seal the flag with friezacrypt (AES-256-CBC + pbkdf2)
  ansible.builtin.shell:
    cmd: >-
      printf '%s\n' '{{ flag_ball_4 }}'
      | openssl enc -aes-256-cbc -pbkdf2 -salt -k '{{ ball4_decrypt_key }}'
      -out '{{ capsule_data }}/tmp/.radarcache/dragon_ball_4.{{ ball4_cipher_ext }}'
    creates: "{{ capsule_data }}/tmp/.radarcache/dragon_ball_4.{{ ball4_cipher_ext }}"
  no_log: true

- name: Dragon ball 4 — perms on the sealed blob (www-data readable)
  ansible.builtin.file:
    path: "{{ capsule_data }}/tmp/.radarcache/dragon_ball_4.{{ ball4_cipher_ext }}"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Dragon ball 4 — drop Frieza's ransom note next to the sealed ball
  ansible.builtin.copy:
    dest: "{{ capsule_data }}/tmp/.radarcache/LEEME_RESCATE.txt"
    owner: www-data
    group: www-data
    mode: "0644"
    content: |
      ===============  FUERZAS ESPECIALES GINYU  -  COMUNICADO OFICIAL  ===============

                       "De parte de Lord Freezer. Con desprecio."

      Vaya, vaya... asi que encontraste la CVE-2024-42069 y abriste la puerta.
      No esta nada mal para un simple Saiyan.

      Pero de verdad creiste que serias el UNICO en darte cuenta de ese agujero?
      Nosotros lo encontramos primero. Fuimos mas rapidos. Y mientras tu apenas
      llegabas arrastrandote, nosotros ya nos habiamos llevado la Esfera de 4
      Estrellas de este radar.

      Ahora pertenece a Lord Freezer. La dejamos sellada aqui mismo, en este
      radar, para que puedas verla y sufrir sin poder abrirla jamas.

      Pero somos gente de negocios. Por solo 100.000.000 de zenis, esta esfera
      podria volver a tus manos. Transfiere el pago y te enviaremos la clave de
      descifrado. Palabra de las Fuerzas Ginyu.

      ...

      ...jajaja. Es broma. JAMAS traicionariamos a Lord Freezer por dinero. La
      clave ya no existe. Esa esfera esta perdida para siempre, insecto.

      Ah, y ni acudas a buscar ayuda en esos pateticos portales gratuitos que
      monta la division de I+D de Capsule Corp para los llorones que no quieren
      pagar rescate.

      No te servira de NADA. Nadie regala descifradores en este universo. Nadie.

                                              -- Fuerzas Especiales Ginyu
                                                 Al servicio de Lord Freezer

# ---- goku home: user flag + ball #5 + ssh key --------------------------------
- name: goku training dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: goku
    group: goku
    mode: "0700"
  loop:
    - /home/goku/training
    - /home/goku/training/memories

# Ball #5 is no longer a plaintext file in goku's home: it lives inside the
# internal Gravity Chamber service (role: gravity) and is released only after
# tunneling in and training at 100x. goku gets a hint note there instead.
- name: user.txt
  ansible.builtin.copy:
    content: "{{ flag_user }}\n"
    dest: /home/goku/user.txt
    owner: goku
    group: goku
    mode: "0640"

- name: goku .ssh dir
  ansible.builtin.file:
    path: /home/goku/.ssh
    state: directory
    owner: goku
    group: goku
    mode: "0700"

- name: goku authorized_keys (inert pubkey; password path is the intended one)
  ansible.builtin.copy:
    src: goku_authorized_keys
    dest: /home/goku/.ssh/authorized_keys
    owner: goku
    group: goku
    mode: "0600"

# ---- Shenlong collection directory (player populates this as root) -----------
- name: Dragon ball collection altar dir
  ansible.builtin.file:
    path: "{{ dragonballs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Leave a hint in the collection dir
  ansible.builtin.copy:
    content: |
      Place all 7 dragon balls here as dragon_ball_1.txt .. dragon_ball_7.txt,
      then run /root/invoke_shenlong.sh to summon Shenlong.
    dest: "{{ dragonballs_dir }}/README.txt"
    owner: root
    group: root
    mode: "0644"
