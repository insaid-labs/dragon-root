---
# ============================================================================
#  privesc — sudo wildcard target + Shenlong + root-area flags + mtime theming
# ============================================================================

# ---- The vulnerable sudo target (root:goku, 0750) ---------------------------
- name: Deploy radar-backup.sh
  ansible.builtin.copy:
    src: radar-backup.sh
    dest: /usr/local/bin/radar-backup.sh
    owner: root
    group: goku
    mode: "0750"

- name: Deploy sudoers rule for goku (validated)
  ansible.builtin.copy:
    src: sudoers_goku
    dest: /etc/sudoers.d/goku
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Ensure /var/backups/radar exists
  ansible.builtin.file:
    path: /var/backups/radar
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---- Ball #6: root's secrets -------------------------------------------------
- name: /root/.secrets dir
  ansible.builtin.file:
    path: /root/.secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Dragon ball 6 (sudo wildcard loot)
  ansible.builtin.copy:
    content: "{{ flag_ball_6 }}\n"
    dest: /root/.secrets/dragon_ball_6.txt
    owner: root
    group: root
    mode: "0600"

# ---- Ball #7: the Shenlong altar --------------------------------------------
- name: Shenlong altar dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/shenlong
    - /opt/shenlong/altar

# Ball #7 is no longer a plaintext file: it is sealed in the web altar and
# unlocked only with this root-only Seal of Ki via the Burp summon ritual.
- name: Seal of Ki (root-only; lifts the web altar's 7-star seal)
  ansible.builtin.copy:
    content: "{{ altar_sigil }}\n"
    dest: /opt/shenlong/altar/ki_sigil
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Shenlong ritual scroll (root-only, in-box guidance)
  ansible.builtin.copy:
    dest: /opt/shenlong/altar/RITUAL.txt
    owner: root
    group: root
    mode: "0600"
    content: |
      ~~~~~~~~~~~~~~~~  PERGAMINO DEL ALTAR DE SHENLONG  ~~~~~~~~~~~~~~~~

      Solo quien domina el santuario (tu, ahora que eres root) lee esto.

      La Esfera de 7 Estrellas ya no descansa en piedra: fue sellada en
      el Altar del Radar, que vive en la red de Capsule Corp:

          http://{{ box_hostname }}/altar

      Para despertar a Shenlong, el ritual exige TRES verdades y el
      SELLO DEL KI que guardas en este santuario (archivo: ki_sigil):

        - El dragon de la TIERRA solo responde en la Tierra.
          (En Namek no despierta Shenlong, sino Porunga.)
        - Kami-sama, guardian de las esferas, debe estar VIVO.
          (Si ha muerto, las esferas son simples piedras.)
        - Tu nivel de poder debe SUPERAR los 9000.

      El altar escuchara tu peticion... pero no te la pondra facil:
      tendras que corregir la ofrenda tu mismo antes de que ella llegue.

      ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# ---- root.txt + bonus + the summon script -----------------------------------
- name: root.txt
  ansible.builtin.copy:
    content: "{{ flag_root }}\n"
    dest: /root/root.txt
    owner: root
    group: root
    mode: "0600"

- name: wish_granted.txt (bonus)
  ansible.builtin.copy:
    content: "{{ flag_bonus }}\n"
    dest: /root/wish_granted.txt
    owner: root
    group: root
    mode: "0600"

- name: invoke_shenlong.sh
  ansible.builtin.copy:
    src: invoke_shenlong.sh
    dest: /root/invoke_shenlong.sh
    owner: root
    group: root
    mode: "0700"

# ===========================================================================
#  Final pass: 2015 theming of file mtimes (easter-egg artifacts -> 2024)
#  Runs last so every artifact from every role already exists.
# ===========================================================================
- name: Normalize box-content mtimes to 2015
  ansible.builtin.shell: |
    set -e
    touch -t {{ mtime_2015 }} \
      /srv/ftp/employee_roster.txt \
      /srv/ftp/network_diagram.png \
      /srv/ftp/dragon_ball_1.txt \
      /var/mail/bulma \
      /var/capsule/uploads/processed/dragon_ball_3.txt \
      /var/capsule/tmp/.radarcache/dragon_ball_4.{{ ball4_cipher_ext }} \
      /var/capsule/tmp/.radarcache/LEEME_RESCATE.txt \
      /home/goku/training/memories/NOTA_camara.txt \
      /home/goku/user.txt \
      /root/.secrets/dragon_ball_6.txt \
      /opt/shenlong/altar/ki_sigil \
      /opt/shenlong/altar/RITUAL.txt \
      /root/root.txt \
      /root/wish_granted.txt \
      /root/invoke_shenlong.sh \
      /usr/local/bin/radar-backup.sh
    find /var/www/capsule -exec touch -t {{ mtime_2015 }} {} +
  changed_when: true

- name: Easter egg from the future -> 2024 mtime
  ansible.builtin.command:
    cmd: "touch -t {{ mtime_2024 }} /srv/ftp/README_2024.txt"
  changed_when: true
